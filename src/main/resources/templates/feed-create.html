<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.8.1/font/bootstrap-icons.min.css">
  <meta charset="UTF-8">
  <title>Create/Edit Feed</title>
  <style>
    @font-face {
      font-family: 'SBAggroB';
      src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2108@1.1/SBAggroB.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }
    body {
      font-family: 'SBAggroB', Arial, sans-serif;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    #feedFormContainer {
      background-color: #ffffff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      width: 800px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      position: relative;
    }
    #header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    #imageUploadContainer {
      background-color: #f8f8f8;
      border: 2px dashed #cccccc;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
      border-radius: 10px;
    }
    #createEditButton {
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    #createEditButton:hover {
      background-color: #0056b3;
    }
    #contentContainer {
      background-color: #f8f8f8;
      padding: 10px;
      border-radius: 10px;
    }
    #feedContentInput {
      width: 100%;
      height: 80px;
      border: none;
      resize: none;
      background: transparent;
      font-size: 1em;
      outline: none;
    }
    #closeButton {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: transparent;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #333;
      z-index: 100;
    }
    #closeButton:hover {
      color: #ff0000;
    }
    #successMessage {
      display: none;
      text-align: center;
      position: relative;
    }
    .checkIcon {
      font-size: 80px;
      color: #ff007f;
    }
    #previewContainer {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    .previewImage {
      width: 200px;
      height: 200px;
      object-fit: cover;
      cursor: pointer;
      border-radius: 5px;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body>
<div id="feedFormContainer">
  <!-- 게시물 작성 폼 -->
  <div id="formContent">
    <div id="header">
      <button id="closeButton" onclick="closeFeed()">&times;</button>
      <h1>새 게시물 만들기</h1>
      <button id="createEditButton" onclick="createFeed()">생성</button>
    </div>
    <div id="imageUploadContainer">
      <i class="bi bi-camera" style="font-size: 50px;"></i>
      <p>사진을 선택해 주세요</p>
      <button type="button" onclick="document.getElementById('fileInput').click()">컴퓨터에서 선택</button>
      <input type="file" id="fileInput" style="display: none;" multiple onchange="previewImages()">
      <div id="previewContainer"></div>
    </div>
    <div id="contentContainer">
      <textarea id="feedContentInput" placeholder="피드를 적어주세요"></textarea>
    </div>
  </div>

  <!-- 성공 메시지 -->
  <div id="successMessage">
    <button id="closeButtonSuccess" onclick="closeFeed()">&times;</button>
    <div class="checkIcon">&#x2714;</div>
    <h1>게시물이 공유되었습니다.</h1>
  </div>
</div>

<script>
  // 게시물 생성 함수
  function createFeed() {
    const content = document.getElementById('feedContentInput').value;
    const files = document.getElementById('fileInput').files;

    const formData = new FormData();
    formData.append('feedContent', content);

    const hashtags = content.match(/#\w+/g) || [];
    hashtags.forEach((hashtag, index) => {
      formData.append(`hashtags[${index}]`, hashtag);
    });

    if (files.length > 0) {
      Array.from(files).forEach(file => formData.append('images', file));
    }

    fetch('/feed/create', {
      method: 'POST',
      body: formData,
    })
            .then(response => response.json())
            .then(data => {
              if (data.status === 'success') {
                window.location.href = data.redirectUrl;
              } else {
                alert('Error: ' + data.message);
              }
            })
            .catch(error => console.error('Error:', error));
  }

  // 메인 페이지로 리디렉션하는 함수
  function closeFeed() {
    window.location.href = '/linksy'; // 메인 페이지 URL로 이동
  }

  // 이미지 미리보기 함수
  function previewImages() {
    const files = document.getElementById('fileInput').files;
    const previewContainer = document.getElementById('previewContainer');
    previewContainer.innerHTML = '';

    Array.from(files).forEach((file) => {
      const reader = new FileReader();
      reader.onload = function (e) {
        const img = document.createElement('img');
        img.src = e.target.result;
        img.className = 'previewImage';
        img.onclick = function () {
          window.open(e.target.result, '_blank');
        };
        previewContainer.appendChild(img);
      };
      reader.readAsDataURL(file);
    });
  }
</script>
</body>
</html>
